    if (y < 8) y = ev.clientY + 16;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.classList.remove("on"); }
  document.addEventListener("pointerover", function (ev) {
    var el = ev.target.closest && ev.target.closest("[data-tip]");
    if (el) showTip(ev, esc(el.getAttribute("data-tip")));
  });
  document.addEventListener("pointermove", function (ev) {
    var el = ev.target.closest && ev.target.closest("[data-tip]");
    if (el) showTip(ev, esc(el.getAttribute("data-tip")));
    else if (!(ev.target.id === "hit")) hideTip();
  });

  // ------------------------------------------------------------ events
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-days")) {
      days = +b.getAttribute("data-days"); store("ffStats.days", String(days)); load();
    } else if (b.hasAttribute("data-lang")) {
      lang = b.getAttribute("data-lang"); store("ffStats.lang", lang); render();
    } else if (b.hasAttribute("data-more")) {
      showAllDecisions = !showAllDecisions; render();
    } else if (b.hasAttribute("data-retry")) {
      load();
    }
  });
  document.addEventListener("toggle", function (ev) { if (ev.target.id === "events") eventsOpen = ev.target.open; }, true);

  var lastW = document.documentElement.clientWidth, rz = null;
  addEventListener("resize", function () {
    clearTimeout(rz);
    rz = setTimeout(function () { var w = document.documentElement.clientWidth; if (w !== lastW && status === "ok") { lastW = w; render(); } }, 150);
  });

  load();
})();
</script>
</body>
</html>
