name: Little Entrepreneur · iOS TestFlight

# Builds The Little Entrepreneur iOS app (little-app/, wrapping little/) and uploads it to TestFlight.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                  10-character Team ID (developer.apple.com → Membership)
#   APP_STORE_CONNECT_KEY_ID       App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID    Issuer ID shown above the keys list
#   APP_STORE_CONNECT_API_KEY      contents of the AuthKey_XXXX.p8 file (Admin role,
#                                  so Xcode can create the distribution certificate)
# (the same ones Founder Fog uses) and an app in App Store Connect with bundle ID
# com.ahmedhaz.littleentrepreneur. The bundle ID is registered by this workflow; the app
# record itself has to be created once on appstoreconnect.apple.com (Apple has no API for it).

on:
  workflow_dispatch:
  push:
    branches: [main, feat/little-ios]
    paths:
      - 'little/**'
      - 'little-app/**'
      - '.github/workflows/little-testflight.yml'

# Same group as Founder Fog: both workflows revoke the certificates CI created,
# so they must never run at the same time.
concurrency:
  group: founder-fog-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: little-app
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - name: Check secrets
        working-directory: .
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing TestFlight secrets:$missing (see the top of this workflow file)"
            exit 1
          fi

      - uses: actions/checkout@v4

      # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26+).
      - name: Select Xcode 26
        working-directory: .
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: little-app/package-lock.json

      - run: npm ci
      - run: npm run www
      - run: npx cap sync ios
        env:
          LANG: en_US.UTF-8

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_API_KEY" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Register bundle ID and check the App Store Connect app
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          import jwt
          BUNDLE = "com.ahmedhaz.littleentrepreneur"
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "keys", "AuthKey_%s.p8" % os.environ["ASC_KEY_ID"])).read()
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def call(method, path, body=None):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, method=method,
                                           data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read() or b"null")
          ids = call("GET", "/v1/bundleIds?filter[identifier]=%s&limit=5" % BUNDLE)["data"]
          if not [b for b in ids if b["attributes"]["identifier"] == BUNDLE]:
              call("POST", "/v1/bundleIds", {"data": {"type": "bundleIds", "attributes": {"identifier": BUNDLE, "name": "Little Entrepreneur", "platform": "IOS"}}})
              print("registered bundle ID", BUNDLE)
          else:
              print("bundle ID exists:", BUNDLE)
          apps = call("GET", "/v1/apps?filter[bundleId]=%s" % BUNDLE)["data"]
          if not apps:
              print("::error::No app in App Store Connect for %s yet. Create it once: Apps > + > New App, bundle ID %s, then re-run." % (BUNDLE, BUNDLE))
              raise SystemExit(1)
          print("App Store Connect app:", apps[0]["attributes"]["name"], apps[0]["id"])
          PY

      # Each run signs on a fresh machine, so Xcode creates a new certificate
      # every time and the account eventually hits Apple's certificate limit.
      # Revoke the ones earlier runs created ("Created via API") first.
      # Certificates made on a Mac in Xcode have other names and are kept;
      # builds already on TestFlight are not affected.
      - name: Revoke certificates from earlier runs
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, time, urllib.request
          import jwt
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "keys", "AuthKey_%s.p8" % os.environ["ASC_KEY_ID"])).read()
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def call(method, path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, method=method,
                                           headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else None
          certs = call("GET", "/v1/certificates?limit=200")["data"]
          revoked = 0
          for c in certs:
              a = c["attributes"]
              label = "%s | %s | %s" % (a.get("certificateType"), a.get("displayName"), a.get("name"))
              if "Created via API" in (a.get("displayName") or "") or "Created via API" in (a.get("name") or ""):
                  call("DELETE", "/v1/certificates/" + c["id"])
                  revoked += 1
                  print("revoked:", label)
              else:
                  print("kept:   ", label)
          print("%d certificate(s) revoked, %d kept" % (revoked, len(certs) - revoked))
          PY

      - name: Archive
        working-directory: little-app/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        working-directory: little-app/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### Uploaded Little Entrepreneur build ${{ github.run_number }} to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in App Store Connect → TestFlight after Apple finishes processing (usually 5–30 min)." >> "$GITHUB_STEP_SUMMARY"
